    <script>

      function redirectPage() {
  
          // Get the current URL's query string
  
          const queryString = window.location.search;
  
          const urlParams = new URLSearchParams(queryString);
  
  
          // Initialize UTM query parameters
  
          let utmParamQueryString = '';
  
          const utmParams = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'utm_placement'];
  
  
  
          // Loop through the UTM parameters to check and append them
  
          utmParams.forEach(param => {
  
              const value = urlParams.get(param);
  
              if (value) {
  
                  utmParamQueryString += &${param}=${encodeURIComponent(value)};
  
              }
  
          });
  

  
          // Trim leading '&' and add '?' at the start if parameters exist
  
          if (utmParamQueryString.length > 0) {
  
              utmParamQueryString = '?' + utmParamQueryString.substring(1);
  
          }
  

          // Redirect to the target URL with the UTM parameters
  
          window.location.href = `https://www.expertisoracademy.in/courses/MasterTech-Creator-Mentorship-Program-67ec2a9a57589948c89aa275${utmParamQueryString}`;
  
      }
  
  </script>
